name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  # Fast, network-free gate on every push/PR: imports + offline unit checks
  # (RBAC, masking, injection, retry/circuit-breaker). No secrets needed.
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r backend/requirements.txt
      - name: Smoke test (imports + offline units)
        run: python scripts/ci_smoke.py

  # Phase 9/18: the LLM-as-judge regression gate. Only runs when a prompt or agent
  # changes, since it makes real LLM calls and costs money/time. Fails the build if the
  # eval score drops below the committed baseline tolerance (regression_gate.py).
  # Requires repo secrets: GROQ_API_KEY, VOYAGE_API_KEY, TIGER_DATABASE_URL.
  regression-gate:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    services:
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 10s
          --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - name: Check whether prompts/ or agents/ changed
        id: filter
        run: |
          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"
          git fetch --no-tags --depth=50 origin "$base" || true
          if git diff --name-only "$base" "$head" | grep -qE '^backend/(prompts|agents)/'; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No prompt/agent changes - skipping the regression gate."
          fi
      - uses: actions/setup-python@v5
        if: steps.filter.outputs.changed == 'true'
        with:
          python-version: "3.12"
      - name: Install dependencies
        if: steps.filter.outputs.changed == 'true'
        run: pip install -r backend/requirements.txt
      - name: Run regression gate
        if: steps.filter.outputs.changed == 'true'
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          VOYAGE_API_KEY: ${{ secrets.VOYAGE_API_KEY }}
          TIGER_DATABASE_URL: ${{ secrets.TIGER_DATABASE_URL }}
          REDIS_URL: redis://localhost:6379
        run: python -m backend.evaluation.regression_gate
